name: Tag/Publish Release

on:
  push:
    branches:
      - master
      - publish-ghcr # For testing purposes

jobs:
  # CAUTION: Other actions depend on this name "tag-github"
  tag-github:
    uses: onosproject/.github/.github/workflows/tag-github.yml@main
    secrets: inherit

  publish-ghcr:
    # needs: tag-github
    if: github.repository_owner == 'onosproject' || github.repository_owner == 'andybavier'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.13.0'

      - name: Build chart dependencies
        run: |
          helm dep build aether-roc-umbrella

      - name: Package Helm chart
        run: |
          helm package aether-roc-umbrella

      - name: Login to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push chart to GHCR
        run: |
          # Convert owner name to lowercase for the registry URL
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          helm push aether-roc-umbrella-*.tgz oci://ghcr.io/$OWNER

      - name: Logout from GHCR
        if: always()
        run: |
          helm registry logout ghcr.io

  update-version:
    needs: tag-github
    if: needs.tag-github.outputs.changed == 'true'
    uses: onosproject/.github/.github/workflows/bump-version.yml@main
    secrets: inherit
    with:
      version: ${{ needs.tag-github.outputs.version }}
